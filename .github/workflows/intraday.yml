name: Strategy C — Intraday

on:
  schedule:
    # Every 15 minutes, 9:15 AM to 3:50 PM EDT (13:15–19:50 UTC).
    # The Python session guards (is_trading_day, time window) provide the
    # authoritative check — the cron windows are approximate.
    - cron: "15,30,45 13 * * 1-5"      # 9:15–9:45 AM EDT
    - cron: "0,15,30,45 14-19 * * 1-5" # 10:00 AM–3:45 PM EDT
    - cron: "50 19 * * 1-5"             # 3:50 PM EDT
  workflow_dispatch:

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  intraday:
    name: Intraday poll
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run intraday session
        run: python sessions/intraday.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_C }}
          ALPACA_API_KEY_ID_C: ${{ secrets.ALPACA_API_KEY_ID_C }}
          ALPACA_API_SECRET_KEY_C: ${{ secrets.ALPACA_API_SECRET_KEY_C }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_C }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_C }}
          TENANT_ID: ${{ secrets.TENANT_ID_C }}
          WORKFLOW_ID: ${{ secrets.WORKFLOW_ID_C }}
          ARGUS_URL: ${{ secrets.ARGUS_URL }}
          NTFY_TOPIC_C: ${{ secrets.NTFY_TOPIC_C }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        amit.thirdeyetrading@gmail.com
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          repo = "${{ github.repository }}"
          run  = "${{ github.run_id }}"
          url  = f"https://github.com/{repo}/actions/runs/{run}"
          msg  = MIMEText(f"Strategy C intraday FAILED.\n\nLogs: {url}")
          msg["Subject"] = f"[Strategy C] intraday FAILED"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["ALERT_EMAIL"]
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(msg)
          print("Failure alert sent.")
          PY
