name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          # Unit tests use mock_supabase; these vars are placeholders for
          # any future integration tests that hit the test Supabase project.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_C_TEST }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_C_TEST }}

  typescript-tests:
    name: TypeScript tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/ts/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agents/ts

      - name: Run Jest
        run: npm test
        working-directory: agents/ts
