name: Strategy C — Premarket

on:
  schedule:
    # 7:15 AM EDT (UTC-4). In EST (UTC-5, Nov–Mar) this fires at 6:15 AM ET —
    # early but within premarket window; Python guards handle trading_day check.
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  premarket:
    name: Premarket session
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Phase 1: uncomment to compile TypeScript News Analyst before session runs.
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "20"
      #     cache: npm
      #     cache-dependency-path: agents/ts/package-lock.json
      # - name: Build TypeScript News Analyst
      #   run: npm ci && npm run build
      #   working-directory: agents/ts

      - name: Run premarket session
        run: python sessions/premarket.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_C }}
          ALPACA_API_KEY_ID_C: ${{ secrets.ALPACA_API_KEY_ID_C }}
          ALPACA_API_SECRET_KEY_C: ${{ secrets.ALPACA_API_SECRET_KEY_C }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_C }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_C }}
          TENANT_ID: ${{ secrets.TENANT_ID_C }}
          NTFY_TOPIC_C: ${{ secrets.NTFY_TOPIC_C }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      - name: Verify premarket wrote session record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_C }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_C }}
        run: |
          python - <<'PY'
          import os, sys
          from datetime import date
          from supabase import create_client
          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          today = date.today().isoformat()
          rows = sb.table("c_sessions").select("id").eq("date", today).neq("is_simulated", True).execute().data
          if not rows:
              print(f"ASSERTION FAILED: no real premarket session in c_sessions for {today}")
              sys.exit(1)
          print(f"Assertion passed: premarket session found for {today}")
          PY

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        amit.thirdeyetrading@gmail.com
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          repo = "${{ github.repository }}"
          run  = "${{ github.run_id }}"
          url  = f"https://github.com/{repo}/actions/runs/{run}"
          msg  = MIMEText(f"Strategy C premarket FAILED.\n\nLogs: {url}")
          msg["Subject"] = f"[Strategy C] premarket FAILED"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["ALERT_EMAIL"]
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(msg)
          print("Failure alert sent.")
          PY
