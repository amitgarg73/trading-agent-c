name: Strategy C — Premarket

on:
  workflow_dispatch:
    inputs:
      bypass_window:
        description: "Run the pipeline outside the 06:00-10:30 ET premarket window (paper account only)"
        type: boolean
        default: false

concurrency:
  group: premarket
  cancel-in-progress: false

jobs:
  premarket:
    name: Premarket session
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENING_ENTRY_ENABLED: "false"  # entry redesign OFF, rolled back 2026-07-14 (set "true" to re-enable)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Phase 1: uncomment to compile TypeScript News Analyst before session runs.
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "20"
      #     cache: npm
      #     cache-dependency-path: agents/ts/package-lock.json
      # - name: Build TypeScript News Analyst
      #   run: npm ci && npm run build
      #   working-directory: agents/ts

      - name: Run premarket session
        run: python sessions/premarket.py ${{ inputs.bypass_window && '--bypass-checks' || '' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_C }}
          ALPACA_API_KEY_ID_C: ${{ secrets.ALPACA_API_KEY_ID_C }}
          ALPACA_API_SECRET_KEY_C: ${{ secrets.ALPACA_API_SECRET_KEY_C }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_C }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_C }}
          TENANT_ID: ${{ secrets.TENANT_ID_C }}
          WORKFLOW_ID: ${{ secrets.WORKFLOW_ID_C }}
          ARGUS_URL: ${{ secrets.ARGUS_URL }}
          ARGUS_API_KEY: ${{ secrets.ARGUS_API_KEY_C }}
          PROVY_EMIT: "1"
          NTFY_TOPIC_C: ${{ secrets.NTFY_TOPIC_C }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      - name: Verify premarket wrote session record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_C }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_C }}
          TENANT_ID: ${{ secrets.TENANT_ID_C }}
          WORKFLOW_ID: ${{ secrets.WORKFLOW_ID_C }}
        run: |
          python - <<'PY'
          import os, sys
          from datetime import date, datetime
          import pytz
          from supabase import create_client

          et = pytz.timezone("America/New_York")
          now_et  = datetime.now(et)
          weekday = now_et.weekday()  # 0=Mon … 6=Sun

          if weekday >= 5:
              print(f"Non-trading day ({now_et.strftime('%A')}) — skipping session assertion.")
              sys.exit(0)

          # Assert on the agent's OWN run record, not on Provy's session table.
          #
          # This used to read ag_sessions in this same database. That worked only while Provy and
          # the agent shared one database. Provy split them on 2026-07-25, telemetry moved to
          # Provy production, and this assertion became unfalsifiable here -- it would fail every
          # day no matter how healthy the run was. The run record is also the thing that actually
          # matters: without it the watchdog cannot find today's session and will not manage
          # positions.
          sb = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_KEY"])
          workflow_id = os.environ["WORKFLOW_ID"]
          today_start = date.today().isoformat() + "T00:00:00"
          rows = (
              sb.table("c_sessions")
              .select("id,status,terminal_reason,session_type")
              .eq("workflow_id", workflow_id)
              .eq("session_type", "premarket")
              .eq("is_simulated", False)
              .gte("started_at", today_start)
              .execute()
              .data
          )
          if not rows:
              print(f"ASSERTION FAILED: the agent has no premarket run recorded for {date.today().isoformat()}")
              sys.exit(1)
          print(f"Assertion passed: {len(rows)} run(s) recorded for {date.today().isoformat()}")
          for r in rows:
              print(f"  id={r['id']} status={r['status']} reason={r['terminal_reason']}")
          PY

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL:        amit.thirdeyetrading@gmail.com
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          repo = "${{ github.repository }}"
          run  = "${{ github.run_id }}"
          url  = f"https://github.com/{repo}/actions/runs/{run}"
          msg  = MIMEText(f"Strategy C premarket FAILED.\n\nLogs: {url}")
          msg["Subject"] = f"[Strategy C] premarket FAILED"
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["ALERT_EMAIL"]
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(msg)
          print("Failure alert sent.")
          PY
